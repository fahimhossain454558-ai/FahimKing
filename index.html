<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="Explore Fahim's public projects, from trade licence tools to community sites and creative work.">
  <title>FahimKing | My Projects</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17241f;
      --muted: #64736c;
      --paper: #f5f7f2;
      --line: #e2e8e1;
      --green: #176b4a;
      --mint: #dff3e8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(ellipse at 86% 5%, #d2efdd8c, transparent 29rem), var(--paper);
      line-height: 1.5;
    }

    .wrap { width: min(1120px, calc(100% - 40px)); margin: auto; }
    header { padding: 22px 0; border-bottom: 1px solid var(--line); }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 750;
      text-decoration: none;
    }

    .mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--green);
      font-size: 14px;
    }

    main { padding: clamp(48px, 9vw, 96px) 0 70px; }
    .intro { max-width: 720px; margin-bottom: 36px; }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 8px 1px 0;
      border-radius: 50%;
      background: #45a875;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 66px);
      line-height: 1.05;
      letter-spacing: -.065em;
    }

    .lede { max-width: 570px; margin: 18px 0 0; color: var(--muted); font-size: 18px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }

    .filter {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #43524b;
      background: #ffffffb3;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }

    .filter[aria-pressed="true"] { border-color: var(--green); color: white; background: var(--green); }
    .filter:focus-visible, .search:focus-visible, .project-link:focus-visible { outline: 3px solid #79c99d; outline-offset: 3px; }

    .search {
      width: min(100%, 260px);
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: white;
      font: inherit;
      font-size: 14px;
    }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }

    .card {
      display: flex;
      min-width: 0;
      min-height: 190px;
      flex-direction: column;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 35px #17241f0f;
      transition: transform .18s ease, border-color .18s ease;
    }

    .card:hover { transform: translateY(-3px); border-color: #b7c9bd; }
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }

    .category {
      padding: 5px 9px;
      border-radius: 999px;
      color: #10563a;
      background: var(--mint);
      font-size: 11px;
      font-weight: 700;
    }

    .repo-icon {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #66756d;
    }

    .repo-icon svg { width: 16px; height: 16px; }
    h2 { margin: 0; font-size: 16px; line-height: 1.4; letter-spacing: -.02em; overflow-wrap: anywhere; }
    h2 a { color: inherit; text-decoration: none; }
    h2 a:hover { color: var(--green); text-decoration: underline; }
    .card p { margin: 8px 0 18px; color: var(--muted); font-size: 13px; }

    .project-link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 7px;
      margin-top: auto;
      color: var(--green);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
    }

    .project-link:hover { color: #10563a; text-decoration: underline; }
    .project-link svg { width: 14px; height: 14px; }

    .empty {
      grid-column: 1 / -1;
      padding: 40px;
      border: 1px dashed #c9d5cd;
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer { padding: 22px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; }

    @media (max-width: 850px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .wrap { width: calc(100% - 30px); }
      header { padding: 18px 0; }
      main { padding-top: 48px; }
      .toolbar { align-items: stretch; }
      .filter { min-height: 36px; padding: 7px 10px; }
      .search { width: 100%; }
      .grid { grid-template-columns: 1fr; gap: 11px; }
      .card { min-height: 175px; padding: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="#" aria-label="FahimKing projects home">
        <span class="mark" aria-hidden="true">FK</span>
        <span>FahimKing</span>
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A collection of my work</p>
      <h1 id="page-title">My Projects</h1>
      <p class="lede">One place to explore my public projects. Pick a project to open its GitHub repository.</p>
    </section>

    <section aria-label="Browse projects">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter projects by category">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All <span data-count></span></button>
          <button class="filter" type="button" data-filter="Trade licence" aria-pressed="false">Trade licence</button>
          <button class="filter" type="button" data-filter="Nagad" aria-pressed="false">Nagad</button>
          <button class="filter" type="button" data-filter="Community" aria-pressed="false">Community</button>
          <button class="filter" type="button" data-filter="Creative" aria-pressed="false">Creative</button>
          <button class="filter" type="button" data-filter="Portfolio" aria-pressed="false">Portfolio</button>
        </div>
        <label>
          <span class="visually-hidden">Search projects</span>
          <input class="search" type="search" placeholder="Search projects..." autocomplete="off">
        </label>
      </div>
      <p class="visually-hidden" id="results" aria-live="polite"></p>
      <div class="grid" id="projects"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>Made by Fahim · <span id="year"></span></span>
      <span>Project names open live sites when available; repository links open GitHub.</span>
    </div>
  </footer>

  <script>
    const projects = [
      { name: "fahimhossain454558-ai.github.io", category: "Portfolio", description: "Personal GitHub Pages repository; no live page is currently available." },
      { name: "BANGLADESH-TRADE-LICENCE-08-11-2026-V2-15-11-2026-", category: "Trade licence", description: "Bangladesh trade licence project · version dated 15 Nov 2026.", website: "https://fahimhossain454558-ai.github.io/BANGLADESH-TRADE-LICENCE-08-11-2026-V2-15-11-2026-/" },
      { name: "BANGLADESH-TRADE-LICENCE-08-11-2026-V2-14-11-2026", category: "Trade licence", description: "Bangladesh trade licence project · version dated 14 Nov 2026.", website: "https://fahimhossain454558-ai.github.io/BANGLADESH-TRADE-LICENCE-08-11-2026-V2-14-11-2026/" },
      { name: "Luxury-Cv", category: "Creative", description: "A luxury CV and résumé project.", website: "https://fahimhossain454558-ai.github.io/Luxury-Cv/" },
      { name: "Nagad-Uddokta-Paper-Ready-V2", category: "Nagad", description: "Nagad Uddokta paper-ready project · version 2.", website: "https://fahimhossain454558-ai.github.io/Nagad-Uddokta-Paper-Ready-V2/" },
      { name: "Nagad-Uddokta-Paper-Ready", category: "Nagad", description: "Nagad Uddokta paper-ready project.", website: "https://fahimhossain454558-ai.github.io/Nagad-Uddokta-Paper-Ready/" },
      { name: "BANGLADESH-TRADE-LICENCE-08-11-2026-V2-10-11-2026", category: "Trade licence", description: "Bangladesh trade licence project · version dated 10 Nov 2026.", website: "https://fahimhossain454558-ai.github.io/BANGLADESH-TRADE-LICENCE-08-11-2026-V2-10-11-2026/" },
      { name: "Alumni-Reunion-2026", category: "Community", description: "Alumni reunion project for 2026.", website: "https://fahimhossain454558-ai.github.io/Alumni-Reunion-2026/" },
      { name: "BANGLADESH-TRADE-LICENCE-08-11-2026-V2", category: "Trade licence", description: "Bangladesh trade licence project · version 2.", website: "https://fahimhossain454558-ai.github.io/BANGLADESH-TRADE-LICENCE-08-11-2026-V2/" },
      { name: "BANGLADESH-TRADE-LICENCE-08-11-2026", category: "Trade licence", description: "Bangladesh trade licence project.", website: "https://fahimhossain454558-ai.github.io/BANGLADESH-TRADE-LICENCE-08-11-2026/" },
      { name: "BANGLADESH-TRADE-LICENCE-WITH-SUPERVISOR-SIGNATURE", category: "Trade licence", description: "Trade licence project with supervisor signature.", website: "https://fahimhossain454558-ai.github.io/BANGLADESH-TRADE-LICENCE-WITH-SUPERVISOR-SIGNATURE/" },
      { name: "Bangladesh-Trade-Licence-Mobile-Version", category: "Trade licence", description: "Mobile version of the Bangladesh trade licence project.", website: "https://fahimhossain454558-ai.github.io/Bangladesh-Trade-Licence-Mobile-Version/" },
      { name: "Muradpur-Adarsha-High-School-Punormilon", category: "Community", description: "Muradpur Adarsha High School reunion project.", website: "https://fahimhossain454558-ai.github.io/Muradpur-Adarsha-High-School-Punormilon/" },
      { name: "Nagad-Custom-QR-Code", category: "Nagad", description: "Custom QR code project for Nagad.", website: "https://fahimhossain454558-ai.github.io/Nagad-Custom-QR-Code/" },
      { name: "BD-Trade-Licence-Professional", category: "Trade licence", description: "Professional Bangladesh trade licence project.", website: "https://fahimhossain454558-ai.github.io/BD-Trade-Licence-Professional/" },
      { name: "trade-licence-spa", category: "Trade licence", description: "Single-page trade licence application.", website: "https://fahimhossain454558-ai.github.io/trade-licence-spa/" },
      { name: "BD-Trade-Licence", category: "Trade licence", description: "Bangladesh trade licence project.", website: "https://fahimhossain454558-ai.github.io/BD-Trade-Licence/" }
    ];

    const projectGrid = document.querySelector("#projects");
    const searchInput = document.querySelector(".search");
    const resultMessage = document.querySelector("#results");
    const filters = [...document.querySelectorAll(".filter")];
    let activeFilter = "all";

    function renderProjects() {
      const query = searchInput.value.trim().toLowerCase();
      const visibleProjects = projects.filter((project) => {
        const matchesCategory = activeFilter === "all" || project.category === activeFilter;
        const matchesSearch = `${project.name} ${project.category} ${project.description}`.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      projectGrid.innerHTML = visibleProjects.length
        ? visibleProjects.map((project) => `
          <article class="card">
            <div class="card-top">
              <span class="category">${project.category}</span>
              <span class="repo-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none"><path d="M5 3.5H4A1.5 1.5 0 0 0 2.5 5v7A1.5 1.5 0 0 0 4 13.5h7a1.5 1.5 0 0 0 1.5-1.5v-1M8 2.5h5.5V8M13.25 2.75 7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </div>
            <h2><a href="${project.website || `https://github.com/fahimhossain454558-ai/${encodeURIComponent(project.name)}`}" target="_blank" rel="noopener noreferrer">${project.name}</a></h2>
            <p>${project.description}</p>
            <a class="project-link" href="https://github.com/fahimhossain454558-ai/${encodeURIComponent(project.name)}" target="_blank" rel="noopener noreferrer">
              View repository
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9m-3.5-3.5L12.5 8 9 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </article>`).join("")
        : '<p class="empty">No projects match your search. Try another name or category.</p>';

      document.querySelector("[data-count]").textContent = `(${visibleProjects.length})`;
      resultMessage.textContent = `${visibleProjects.length} ${visibleProjects.length === 1 ? "project" : "projects"} shown`;
    }

    filters.forEach((button) => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filters.forEach((filter) => filter.setAttribute("aria-pressed", String(filter === button)));
        renderProjects();
      });
    });

    searchInput.addEventListener("input", renderProjects);
    document.querySelector("#year").textContent = new Date().getFullYear();
    renderProjects();
  </script>
</body>
</html>
